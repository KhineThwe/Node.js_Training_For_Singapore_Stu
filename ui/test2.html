<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD - create user</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="text-center">User CRUD</h1>
    <div class="row">
      <div class="col">
        <div class="card p-5">
          <div class="form-group">
            <label class="form-label" for="fname">First Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="First name"
              aria-label="First name"
              id="fname"
            />
          </div>
          <div class="form-group mt-3">
            <label class="form-label" for="lname">Last Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="Last name"
              aria-label="Last name"
              id="lname"
            />
          </div>
          <button type="button" id="save" class="btn btn-primary mt-3">
            Submit
          </button>
        </div>
      </div>

      <div class="col">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">First</th>
              <th scope="col">Last</th>
              <th scope="col">Update</th>
              <th scope="col">Delete</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <th scope="row">1</th>
              <td>Mark</td>
              <td>Otto</td>
              <td>Update Button</td>
              <td>Delete Button</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      function getAllUser() {
        let tbody = document.querySelector("#tbody");
        tbody.innerHTML = "";
        fetch("http://127.0.0.1:8000/user/getAllUser")
          .then((res) => {
            return res.json();
          })
          .then((d) => {
            let userList = d.data;
            userList.map((u) => {
              let tr = document.createElement("tr");
              let no = document.createElement("th");
              let first = document.createElement("td");
              let second = document.createElement("td");
              let update = document.createElement("td");
              let del = document.createElement("td");
              let updateBtn = document.createElement("button");
              let deleteBtn = document.createElement("button");
              tr.appendChild(no);
              tr.appendChild(first);
              tr.appendChild(second);
              tr.appendChild(update);
              tr.appendChild(del);
              update.appendChild(updateBtn);
              del.appendChild(deleteBtn);
              tbody.appendChild(tr);

              first.innerText = u.first_name;
              second.innerText = u.last_name;
              no.innerText = u.id;
              updateBtn.innerText = "Update";
              deleteBtn.innerText = "Delete";

              updateBtn.addEventListener("click", () =>
                console.log("User clicks UpdateBtn" + u.id)
              );

              deleteBtn.addEventListener("click", () =>
                console.log("User clicks DeleteBtn")
              );
            });
          });
      }

      //fun call
      getAllUser();

      let first_name = document.querySelector("#fname");
      let last_name = document.querySelector("#lname");
      let save = document.querySelector("#save");
      save.addEventListener("click", () => console.log("Clicking Save Button"));
    </script>
  </body>
</html>
